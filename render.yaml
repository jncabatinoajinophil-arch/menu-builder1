databases:
  - name: menu-builder-db
    plan: free            # free databases expire after 30 days; upgrade in the dashboard for real use
    databaseName: menu_builder
    user: menu_builder

services:
  - type: web
    name: menu-builder
    runtime: node
    plan: free            # sleeps when idle; choose a paid plan to keep it always on
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: menu-builder-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
